{% extends "base.html" %}
{% set title = "Receive stock" %}
{% block body %}
<div class="card" style="max-width:720px">
  <form method="post" action="/admin/inventory/receive">
    <label>Supplier</label>
    <select name="supplier_id" required>
      {% for s in suppliers %}<option value="{{ s.supplier_id }}">{{ s.name }}</option>{% endfor %}
    </select>
    <label>Delivery note</label>
    <input name="reference_note">
    <label>Medicine</label>
    <select name="medicine_id" required>
      {% for m in medicines %}<option value="{{ m.medicine_id }}">{{ m.product_code }} · {{ m.name }}</option>{% endfor %}
    </select>
    <div class="row">
      <div><label>Batch number</label><input name="batch_number" required></div>
      <div><label>Expiry</label><input type="date" name="expiry_date" required></div>
    </div>
    <div class="row">
      <div><label>Quantity</label><input type="number" name="quantity" min="1" required></div>
      <div><label>Unit cost</label><input name="unit_cost"></div>
    </div>
    <p><button class="btn" type="submit">Receive</button></p>
  </form>
</div>
{% endblock %}
